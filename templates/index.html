<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TSE — Resultados em tempo real</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f4f6f8;color:#17202a}
    header{background:#17202a;color:white;padding:22px 28px}
    main{max-width:1100px;margin:24px auto;padding:0 18px}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .card{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 8px #0001}
    .label{font-size:12px;color:#68737d;text-transform:uppercase}
    .value{font-size:24px;font-weight:700;margin-top:5px}
    table{width:100%;border-collapse:collapse;background:white;margin-top:18px;border-radius:12px;overflow:hidden}
    th,td{padding:13px 14px;border-bottom:1px solid #e8ecef;text-align:left}
    th{font-size:12px;color:#68737d;text-transform:uppercase}
    td.num,th.num{text-align:right}
    .bar{height:7px;background:#e6e9ed;border-radius:5px;overflow:hidden;margin-top:6px}
    .bar span{display:block;height:100%;background:#1677ff}
    .status{margin-top:12px;font-size:13px;color:#68737d}
    @media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:520px){.cards{grid-template-columns:1fr 1fr}th:nth-child(2),td:nth-child(2){display:none}}
  </style>
</head>
<body>
<header>
  <strong>TSE — Resultados em tempo real</strong>
  <div>Presidente • Brasil • Eleições 2026</div>
</header>

<main>
  <section class="cards">
    <div class="card"><div class="label">Seções totalizadas</div><div id="secoes" class="value">—</div></div>
    <div class="card"><div class="label">% apurado</div><div id="percentual" class="value">—</div></div>
    <div class="card"><div class="label">Eleitorado totalizado</div><div id="eleitorado" class="value">—</div></div>
    <div class="card"><div class="label">Atualização TSE</div><div id="geracao" class="value" style="font-size:18px">—</div></div>
  </section>

  <div class="status" id="status">Carregando…</div>

  <table>
    <thead>
      <tr>
        <th>#</th><th>Candidato</th><th>Partido</th>
        <th class="num">Votos</th><th class="num">%</th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>
</main>

<script>
const pollMs = {{ poll_seconds }} * 1000;

function fmt(n) {
  return Number(n || 0).toLocaleString("pt-BR");
}

async function atualizar() {
  try {
    const r = await fetch("/resultados", {cache:"no-store"});
    const data = await r.json();

    const t = data.totalizacao || {};
    document.querySelector("#secoes").textContent =
      `${fmt(t.secoes_totalizadas)} / ${fmt(t.secoes_total)}`;
    document.querySelector("#percentual").textContent =
      `${Number(t.percentual_secoes || 0).toLocaleString("pt-BR",{minimumFractionDigits:2})}%`;
    document.querySelector("#eleitorado").textContent =
      fmt(t.eleitorado_totalizado);

    document.querySelector("#geracao").textContent =
      [t.geracao_data, t.geracao_hora].filter(Boolean).join(" ");

    const tbody = document.querySelector("#tabela");
    tbody.innerHTML = "";

    for (const [i,c] of data.candidatos.entries()) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${i+1}</td>
        <td>
          <strong>${c.candidato || c.nome_urna}</strong>
          <div class="bar"><span style="width:${Math.min(Number(c.percentual)||0,100)}%"></span></div>
        </td>
        <td>${c.partido || "—"}</td>
        <td class="num">${fmt(c.votos)}</td>
        <td class="num">${Number(c.percentual||0).toLocaleString("pt-BR",{minimumFractionDigits:2})}%</td>
      `;
      tbody.appendChild(tr);
    }

    document.querySelector("#status").textContent =
      "Última consulta local: " +
      new Date().toLocaleString("pt-BR");
  } catch (e) {
    document.querySelector("#status").textContent =
      "Erro ao consultar a API local: " + e;
  }
}

atualizar();
setInterval(atualizar, pollMs);
</script>
</body>
</html>
